      margin-top: 2px;

      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.15s;

      margin-top: 10px;
    }
    .stat-card {
      background: var(--surface-variant);
      padding: 8px 12px;
      border-radius: 10px;
    }
    .stat-label { font-size: 10px; color: var(--text-muted); }
    .stat-val { font-size: 18px; font-weight: 800; margin-top: 2px; }

      padding: 8px 12px;
      background: var(--primary-dark);
      color: var(--primary-light);
      border-radius: 8px;
      font-size: 11px;
      display: none;
    }
    .content-area {

      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {

      border-radius: 14px;
      padding: 14px;
    }
    .card-highlight {
      border-color: rgba(16, 185, 129, 0.5);
    }
    .chip-scroll {

      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-top: 8px;

    .chip {

      padding: 6px 11px;
      border-radius: 20px;
      font-size: 11px;
      background: var(--surface-variant);
      color: var(--text-muted);
      border: 1px solid var(--border);

    .chip.active {

    .badge-row {

      let raw = (cam.flat > 0 && cam.rate === 0) ? cam.flat : ((amount * (cam.rate / 100)) + cam.flat);
      return Math.min(raw, cam.cap);

            { num: 2, appName: syn.appName, title: `${syn.appName} Üzerinden İşlemi Tamamla`, detail: syn.description, path: syn.whereToFindInApp, reward: mainR, appId: syn.appId }
          ],
          note: "Ödemeyi yapmadan ÖNCE her iki uygulamada da 'Hemen Katıl' butonuna basılmış olmalıdır."
        });
      }

      // 2. Çifte Kazanç Kombosu (Stacking)
      const wallets = rel.filter(c => appMap[c.appId]?.type === "WALLET" && simulatedSpend >= c.minSpend);
      const banks = rel.filter(c => appMap[c.appId]?.type === "BANK" && c.canStackAsBank && simulatedSpend >= c.minSpend);
      if (wallets.length > 0 && banks.length > 0) {
        const bestW = wallets.sort((a,b) => calcReward(b, simulatedSpend) - calcReward(a, simulatedSpend))[0];
        const bestB = banks.sort((a,b) => calcReward(b, simulatedSpend) - calcReward(a, simulatedSpend))[0];
        const wR = calcReward(bestW, simulatedSpend);
        const bR = calcReward(bestB, simulatedSpend);
        const tot = wR + bR;
        plans.push({
          badge: "🔥 ÇİFTE KAZANÇ KOMBOSU (STACKING)",
          title: `${bestB.appName} + ${bestW.appName} Kombosu`,
          subtitle: "Banka kartı kampanyası ile ön ödemeli cüzdan iadesini birleştirerek 2 ayrı kurumdan iade kazanın.",
          totalCashback: tot,
          percent: Math.round((tot / simulatedSpend) * 100),
          steps: [
            { num: 1, appName: bestB.appName, title: `1. Adım: ${bestB.appName} Kampanyasına Katıl`, detail: bestB.title, path: bestB.whereToFindInApp, reward: bR, appId: bestB.appId },
            { num: 2, appName: bestW.appName, title: `2. Adım: ${bestW.appName} ile ${simulatedSpend} TL Ödemeyi Yap`, detail: bestW.title, path: bestW.whereToFindInApp, reward: wR, appId: bestW.appId }
          ],
          note: "Cüzdan içine tanımlı kredi kartıyla QR/Online ödeme yaparak veya kampanya şartına uygun yükleme ile iki kampanyayı birlikte tetikleyin."
        });
      }

      // 3. Harcama Bölme (Split Payment)
      const eligible = [...rel].filter(c => c.minSpend <= simulatedSpend)
        .sort((a,b) => (calcReward(b, b.minSpend)/b.minSpend) - (calcReward(a, a.minSpend)/a.minSpend));
      if (eligible.length >= 2) {
        let rem = simulatedSpend;
        let splitSteps = [];
        let splitTot = 0;
        for (const c of eligible) {
          if (rem >= c.minSpend && splitSteps.length < 3) {
            const slice = c.rate > 0 ? Math.min(rem, Math.max(c.minSpend, c.cap / (c.rate/100))) : c.minSpend;
            if (rem >= slice) {
              const r = calcReward(c, slice);
              if (r > 0) {
                rem -= slice;
                splitTot += r;
                splitSteps.push({
                  num: splitSteps.length + 1,
                  appName: c.appName,
                  title: `${Math.round(slice)} TL'lik Kısmı ${c.appName} ile Öde`,
                  detail: `'${c.title}' alt limiti olan ${Math.round(slice)} TL'yi bu uygulamadan ödeyerek tavan iadeyi (${Math.round(r)} TL) alın.`,
                  path: c.whereToFindInApp,
                  reward: r,
                  appId: c.appId
                });
              }
            }
          }
        }
        const bestSingle = rel.reduce((m, c) => Math.max(m, calcReward(c, simulatedSpend)), 0);
        if (splitSteps.length >= 2 && splitTot > bestSingle) {
          plans.push({
            badge: "✂️ HARCAMA BÖLME (ÇOKLU İADE) STRATEJİSİ",
            title: `Ödemeyi ${splitSteps.length} Parçaya Böl: +${Math.round(splitTot - bestSingle)} TL Fazladan İade!`,
            subtitle: `${simulatedSpend} TL'yi tek karttan çekerseniz üst limit nedeniyle sadece ${Math.round(bestSingle)} TL alırsınız. Bölerek ${Math.round(splitTot)} TL alın!`,
            totalCashback: splitTot,
            percent: Math.round((splitTot / simulatedSpend) * 100),
            steps: splitSteps,
            note: "Kasada veya online siparişte ödemeyi iki ayrı kart/cüzdan (ör. Paycell + Banka/Nays) arasında bölerek her ikisinin tavan iadesini alabilirsiniz."
          });
        }
      }

      // 4. Tek İşlemde En İyi
      const singleSorted = [...rel].map(c => ({ c, r: calcReward(c, simulatedSpend) })).filter(x => x.r > 0).sort((a,b) => b.r - a.r);
      if (singleSorted.length > 0) {
        const best = singleSorted[0];
        plans.push({
          badge: "🎯 TEK İŞLEMDE MAKSİMUM İADE",
          title: `Tek Seferde En Karlı: ${best.c.appName}`,
          subtitle: "Harcamayı bölmeden tek işlemde ödeyecekseniz en yüksek net nakit iadeyi bu kampanya veriyor.",
          totalCashback: best.r,
          percent: Math.round((best.r / simulatedSpend) * 100),
          steps: [
            { num: 1, appName: best.c.appName, title: best.c.requiresJoin ? "Önce Uygulamadan Katıl, Sonra Öde" : "Doğrudan Öde (Otomatik Katılım)", detail: best.c.description, path: best.c.whereToFindInApp, reward: best.r, appId: best.c.appId }
          ],
          note: best.c.requiresJoin ? "DİKKAT: Ödeme öncesi uygulama içi gizli sekmeden 'Hemen Katıl' butonuna basılması zorunludur!" : "Katılım şartı yoktur, doğrudan ödeme yapabilirsiniz."
        });
      }

      return plans.sort((a,b) => b.totalCashback - a.totalCashback);
    }

    function showBanner(msg) {
      const el = document.getElementById("statusBanner");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 4500);
    }

    function simulateDeviceScan() {
      showBanner("📱 Cihaz tarandı: Turkcell, Paycell, Nays, Papara, BonusFlaş, Juzdan, World, Maximum ve Bankkart tespit edildi!");
      render();
    }

    function simulateNotificationCapture() {
      const id = "notif_" + Date.now();
      campaigns.unshift({
        id,
        appId: "paycell",
        appName: "Paycell (Bildirimden Yakalandı)",
        title: "Bana Özel Bildirim: Bu Hafta Sonu Market ve Faturada 750 TL'ye 125 TL Ekstra Nakit İade!",
        description: "Az önce Paycell bildiriminden otomatik yakalandı ve strateji motoruna dahil edildi.",
        whereToFindInApp: "Paycell > Bildirim Çanı (Sağ Üst) > Bana Özel Fırsat > Hemen Katıl",
        category: selectedCategory,
        minSpend: 750, rate: 0, flat: 125, cap: 125, requiresJoin: true,
        canStackAsBank: false, source: "Bildirimden Yakalandı", joined: false
      });
      showBanner("🔔 Paycell'den yeni '750 TL'ye 125 TL Nakit İade' bildirimi yakalandı ve strateji motoruna eklendi!");
      render();
    }

    function switchTab(idx) {
      currentTab = idx;
      for (let i = 0; i < 4; i++) {
        document.getElementById("nav-" + i).classList.toggle("active", i === idx);
      }
      render();
    }

    function toggleJoin(camId) {
      const c = campaigns.find(x => x.id === camId);
      if (c) c.joined = !c.joined;
      render();
    }

    function toggleApp(appId) {
      const a = apps.find(x => x.id === appId);
      if (a) a.enabled = !a.enabled;
      render();
    }

    function openAppUrl(appId) {
      const a = apps.find(x => x.id === appId);
      if (a && a.url) window.open(a.url, "_blank");
    }

    function importCustomCampaign() {
      const txt = document.getElementById("customCamInput").value.trim();
      const appId = document.getElementById("customAppSelect").value;
      if (!txt) return;
      const app = apps.find(a => a.id === appId) || apps[1];
      const matches = [...txt.matchAll(/(\d[\d.]*)\s*TL/gi)].map(m => parseFloat(m[1].replace(".", "")));
      const reward = matches.length >= 2 ? Math.min(...matches) : (matches[0] || 150);
      const minSpend = matches.length >= 2 ? Math.max(...matches) : reward * 5;
      campaigns.unshift({
        id: "ai_" + Date.now(),
        appId: app.id,
        appName: app.name,
        title: txt.slice(0, 85),
        description: txt,
        whereToFindInApp: `${app.name} > ${app.hint}`,
        category: selectedCategory,
        minSpend, rate: 0, flat: reward, cap: reward, requiresJoin: true,
        canStackAsBank: app.type === "BANK", source: "AI / Ekran Görüntüsü", joined: true
      });
      showBanner(`✅ '${app.name}' kampanyası (${minSpend} TL'ye ${reward} TL İade) çözümlendi ve Strateji Motoruna eklendi!`);
      render();
    }

    function generateAiAdvisorReport() {
      const activeApps = apps.filter(a => a.enabled);
      const totalPot = campaigns.filter(c => activeApps.some(a => a.id === c.appId)).reduce((s,c) => s + c.cap, 0);
      aiReportText = `📊 NAKİTRADAR AKILLI STRATEJİ RAPORU
━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
• Aktif Uygulamalarınız: ${activeApps.map(a => a.badge).join(", ")}
• Bu Ayki Toplam Nakit İade Havuzunuz: ${totalPot} TL

⚡ 1. TURKCELL + PAYCELL ÇİFTE İADE ZİNCİRİ:
• Önce Paycell uygulamasında 'Fırsatlar > Fatura Kampanyaları' sekmesinden 75 TL iade kampanyasına 'Hemen Katıl' yapın.
• Ardından Turkcell uygulamasında 'Fatura' sekmesine girip faturanızı Paycell ile ödeyin -> 150 TL (Turkcell) + 75 TL (Paycell) = 225 TL Nakit İade!

🔥 2. MARKET & E-TİCARET HARCAMA BÖLME VE KOMBO:
• 2.250 TL harcamayı tek karttan çekerseniz 150 TL tavan sınırına takılırsınız.
• Bunun yerine: 1.000 TL'sini Paycell Kart ile (+150 TL iade), 1.000 TL'sini BonusFlaş/Juzdan ile (+125/150 TL iade), kalan 250 TL'sini Nays ile (+25 TL iade) ödeyerek toplam 300+ TL nakit iade kazanın!`;
      render();
    }

      const enabledIds = new Set(apps.filter(a => a.enabled).map(a => a.id));

      const joinedTotal = campaigns.filter(c => c.joined).reduce((s, c) => s + c.cap, 0);

      document.getElementById("statPotential").textContent = `${totalPotential} TL`;
      document.getElementById("statJoined").textContent = `${joinedTotal} TL`;

      const container = document.getElementById("mainContent");

      if (currentTab === 0) {
        const plans = generateStrategies();
        container.innerHTML = `

            <div style="font-size:11px; color:var(--text-muted); margin-top:3px;">
              Harcama yapacağınız sektörü ve tutarı seçin; uygulamaları nasıl birleştirerek (Stacking) veya bölerek maksimum nakit iade alacağınızı görün.
            </div>
            <div class="chip-scroll">
              ${categories.map(cat => `
                <div class="chip ${selectedCategory === cat.id ? 'active' : ''}" onclick="selectedCategory='${cat.id}'; render();">
                  ${cat.emoji} ${cat.name}
                </div>
              `).join("")}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
              <span style="font-size:12px;">Planlanan Harcama Tutarı:</span>
              <span style="font-size:17px; font-weight:800; color:var(--primary);">${simulatedSpend} TL</span>
            </div>
            <input type="range" min="200" max="5000" step="50" value="${simulatedSpend}" oninput="simulatedSpend=parseInt(this.value); render();" />
            <div class="btn-row" style="margin-top:4px;">
              ${[500, 1000, 1500, 2250, 3500].map(p => `
                <button class="btn" style="flex:1" onclick="simulatedSpend=${p}; render();">${p}₺</button>
              `).join("")}
            </div>
          </div>

          ${plans.map(plan => `
            <div class="card card-highlight">
              <div class="badge-row">
                <span class="badge-type">${plan.badge}</span>
                <span class="badge-reward">+${Math.round(plan.totalCashback)} TL İADE (%${plan.percent})</span>
              </div>
              <div style="font-weight:700; font-size:15px;">${plan.title}</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:3px;">${plan.subtitle}</div>
              ${plan.steps.map(s => `
                <div class="step-box">
                  <div style="display:flex; justify-content:space-between; font-weight:700; font-size:12px;">
                    <span>${s.num}. ${s.title}</span>
                    <span style="color:var(--primary)">+${Math.round(s.reward)} TL</span>
                  </div>
                  <div style="font-size:11px; color:var(--text-muted); margin-top:3px;">${s.detail}</div>
                  <div class="path-hint">📍 Uygulama İçi Konum: ${s.path}</div>
                  <div style="margin-top:6px;">
                    <button class="btn" onclick="openAppUrl('${s.appId}')">↗ ${s.appName} Kampanyasını Aç</button>
                  </div>
                </div>
              `).join("")}
              <div style="font-size:11px; color:var(--text-muted); margin-top:8px;">💡 ${plan.note}</div>
            </div>
          `).join("")}
        `;
      } else if (currentTab === 1) {
        const filtered = activeCampaigns.filter(c => !selectedFilterApp || c.appId === selectedFilterApp);
        container.innerHTML = `
          <div class="chip-scroll" style="margin-top:0;">
            <div class="chip ${!selectedFilterApp ? 'active' : ''}" onclick="selectedFilterApp=null; render();">
              Tümü (${activeCampaigns.length})
            </div>
            ${apps.filter(a => a.enabled).map(a => `
              <div class="chip ${selectedFilterApp === a.id ? 'active' : ''}" onclick="selectedFilterApp='${a.id}'; render();">
                ${a.name}
              </div>
            `).join("")}
          </div>
          ${filtered.map(c => `
            <div class="card">
              <div class="badge-row">
                <span class="badge-type">${c.appName} • ${c.source}</span>
                <span class="badge-reward">Maks. ${c.cap} TL İade</span>
              </div>
              <div style="font-weight:700; font-size:14px;">${c.title}</div>
              <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">${c.description}</div>
              <div class="path-hint">🧭 Gizli Sekme Konumu: ${c.whereToFindInApp}</div>

          <div class="card card-highlight">
            <div style="font-weight:800; font-size:15px; color:var(--secondary);">⚡ Turkcell + Paycell + Banka 3'lü Sinerji Üssü</div>

              3️⃣ <b>Turkcell Uygulaması:</b> Faturanızı ve Pasaj alışverişinizi Paycell ile ödeyerek iki uygulamanın nakit iadesini aynı anda tetikleyin!

            <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="importCustomCampaign()">
              + Kampanyayı Çözümle ve Stratejiye Ekle
            </button>
          </div>

          <div class="card">
            <div style="font-weight:700; font-size:14px;">🤖 AI Nakit İade Strateji Danışmanı</div>
            <button class="btn btn-primary" style="margin-top:8px; width:100%;" onclick="generateAiAdvisorReport()">
              Bana Özel Nakit İade & Kombo Raporu Üret
            </button>
            ${aiReportText ? `<pre style="white-space:pre-wrap; font-size:11px; background:var(--surface-variant); padding:10px; border-radius:8px; margin-top:8px; color:var(--primary-light);">${aiReportText}</pre>` : ''}
          </div>

          <div class="card">
            <div style="font-weight:700; font-size:14px;">📱 Telefonumdaki Aktif Uygulamalar</div>

            ${apps.map(a => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:7px 0; border-bottom:1px solid var(--surface-variant);">
                <div>
                  <div style="font-size:12px; font-weight:600;">${a.name}</div>
                  <div style="font-size:10px; color:var(--text-muted);">${a.hint}</div>
                </div>
                <button class="btn ${a.enabled ? 'btn-primary' : ''}" onclick="toggleApp('${a.id}')">
                  ${a.enabled ? 'Aktif' : 'Pasif'}
                </button>
              </div>
            `).join("")}
          </div>
        `;
      }
    }

    render();
  </script>
</body>
