<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NakitRadar — Kalan Kota & Bildirim Takip Motoru</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-variant: #eef2f6;
      --border: #e2e8f0;
      --primary: #059669;
      --primary-container: #d1fae5;
      --on-primary-container: #065f46;
      --secondary: #2563eb;
      --secondary-container: #dbeafe;
      --on-secondary-container: #1e40af;
      --tertiary-container: #fef3c7;
      --on-tertiary-container: #92400e;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #dfe5ef;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: 92vh;
      background: var(--bg);
      border: 8px solid #0f172a;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.22);
    }
    .status-bar {
      background: var(--bg);
      padding: 10px 22px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
    }
    .top-header {
      padding: 10px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }
    .icon-btn-group { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      transition: 0.15s;
    }
    .icon-btn:hover { transform: translateY(-1px); border-color: var(--primary); }

    .wallet-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 6px 18px 12px;
      scrollbar-width: none;
    }
    .wallet-carousel::-webkit-scrollbar { display: none; }
    .wallet-card {
      min-width: 194px;
      height: 114px;
      border-radius: 20px;
      padding: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.14);
      transition: transform 0.2s;
      user-select: none;
    }
    .wallet-card:hover { transform: translateY(-2px); }
    .wallet-card.selected {
      outline: 3px solid var(--text);
      outline-offset: 2px;
    }
    .wallet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .wallet-badge {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
    }
    .wallet-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wallet-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 2px;
    }
    .wallet-count { font-size: 11px; opacity: 0.9; font-weight: 600; }
    .wallet-amount { font-size: 17px; font-weight: 800; }

    .toast-banner {
      margin: 0 18px 8px;
      padding: 9px 12px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-radius: 12px;
      font-size: 11.5px;
      font-weight: 700;
      display: none;
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .white-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      transition: 0.15s;
    }
    .white-card.clickable { cursor: pointer; }
    .white-card.clickable:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.08);
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 4px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .cat-pill {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-variant);
      color: var(--text);
      cursor: pointer;
    }
    .cat-pill.active {
      background: var(--text);
      color: #fff;
      font-weight: 700;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .preset-btn {
      background: var(--surface-variant);
      border: none;
      border-radius: 10px;
      padding: 7px 2px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }
    .preset-btn.active {
      background: var(--primary);
      color: #fff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      margin: 10px 0 4px;
    }

    .pill-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }
    .pill-amber { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .pill-blue { background: var(--secondary-container); color: var(--on-secondary-container); }
    .pill-muted { background: var(--surface-variant); color: var(--text-muted); }
    .pill-green {
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 10px;
    }

    .pipeline-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 6px;
    }
    .pipeline-node {
      background: var(--surface-variant);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 130px;
    }
    .node-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .node-title { font-size: 11px; font-weight: 700; color: var(--text); }
    .node-gain { font-size: 11px; font-weight: 700; color: var(--primary); }
    .pipeline-arrow { color: var(--text-muted); font-weight: 800; font-size: 14px; }

    .progress-bar {
      width: 100%;
      height: 7px;
      background: var(--surface-variant);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.25s;
    }

    .bottom-nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px 12px;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.04);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 2px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
    }
    .nav-item.active {
      color: var(--primary);
      background: var(--primary-container);
      font-weight: 800;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }
    .sheet-backdrop.open { display: flex; }
    .bottom-sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 16px 20px 26px;
      max-height: 82%;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.2);
    }
    .sheet-handle {
      width: 42px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 3px;
      margin: 0 auto 14px;
    }
    .btn-full {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-full:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-outline {
      background: var(--surface-variant);
      color: var(--text);
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-outline.joined {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
  </style>
</head>

    let campaigns = JSON.parse(JSON.stringify(defaultCampaigns));
    let spendLogs = [];
    let currentTab = 0;
    let selectedFilterApp = null;
    let selectedCategory = "MARKET_GIDA";
    let simulatedSpend = 2250;
    let currentPlans = [];

    function loadPersistedState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const parsed = JSON.parse(raw);
        if (parsed.campaigns) campaigns = parsed.campaigns;
        if (parsed.spendLogs) spendLogs = parsed.spendLogs;
      } catch (e) {}
    }

    function savePersistedState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({ campaigns, spendLogs }));
      } catch (e) {}
    }

    function remainingQuota(cam) {
      return Math.max(0, cam.cap - (cam.earned || 0));
    }

    function isQuotaFull(cam) {
      return remainingQuota(cam) <= 0.01;
    }

    function calcReward(cam, amount) {
      if (isQuotaFull(cam)) return 0;
      if (amount < cam.minSpend) return 0;
      let raw = (cam.flat > 0 && cam.rate === 0) ? cam.flat : ((amount * (cam.rate / 100)) + cam.flat);
      return Math.min(raw, remainingQuota(cam));
    }

    function buildStrategies() {
      const enabledIds = new Set(apps.filter(a => a.enabled).map(a => a.id));
      const appMap = Object.fromEntries(apps.map(a => [a.id, a]));
      // Kotası dolanları otomatik ele!
      const rel = campaigns.filter(c => enabledIds.has(c.appId) && c.category === selectedCategory && !isQuotaFull(c));
      const plans = [];

      // 1. Sinerji Zinciri
      const syn = rel.find(c => c.synergyPartner && enabledIds.has(c.synergyPartner) && simulatedSpend >= c.minSpend && calcReward(c, simulatedSpend) > 0);
      if (syn) {
        const mainR = calcReward(syn, simulatedSpend);
        const totalR = mainR + (syn.synergyBonus || 0);
        plans.push({
          id: "p_syn",
          badge: "⚡ EKOSİSTEM SİNERJİSİ",
          title: `${syn.appName} + Paycell Çifte İade Zinciri`,
          subtitle: "İki kardeş uygulamanın kalan kotasını aynı harcamada tetikleyerek çifte nakit iade alın.",
          totalCashback: totalR,
          percent: Math.round((totalR / simulatedSpend) * 100),
          involvedIds: [syn.id],
          steps: [
            { num: 1, appName: "Paycell", title: "Paycell Fırsatlar'da Katıl", detail: syn.synergyNote, path: "Paycell > Fırsatlar > Hemen Katıl", reward: syn.synergyBonus, appId: "paycell" },
            { num: 2, appName: syn.appName, title: `${syn.appName} Üzerinden Öde`, detail: syn.description, path: syn.whereToFindInApp, reward: mainR, appId: syn.appId }
          ]
        });
      }

      // 2. Çifte Kazanç Kombosu
      const wallets = rel.filter(c => appMap[c.appId]?.type === "WALLET" && simulatedSpend >= c.minSpend && calcReward(c, simulatedSpend) > 0);
      const banks = rel.filter(c => appMap[c.appId]?.type === "BANK" && c.canStackAsBank && simulatedSpend >= c.minSpend && calcReward(c, simulatedSpend) > 0);
      if (wallets.length > 0 && banks.length > 0) {
        const bestW = [...wallets].sort((a,b) => calcReward(b, simulatedSpend) - calcReward(a, simulatedSpend))[0];
        const bestB = [...banks].sort((a,b) => calcReward(b, simulatedSpend) - calcReward(a, simulatedSpend))[0];
        const wR = calcReward(bestW, simulatedSpend);
        const bR = calcReward(bestB, simulatedSpend);
        const tot = wR + bR;
        plans.push({
          id: "p_combo",
          badge: "🔥 ÇİFTE KAZANÇ KOMBOSU",
          title: `${bestB.appName} + ${bestW.appName} Kombosu`,
          subtitle: `Banka kalan kotası (${remainingQuota(bestB)} ₺) ile cüzdan kalan kotasını (${remainingQuota(bestW)} ₺) birleştirin.`,
          totalCashback: tot,
          percent: Math.round((tot / simulatedSpend) * 100),
          involvedIds: [bestB.id, bestW.id],
          steps: [
            { num: 1, appName: bestB.appName, title: `${bestB.appName} Kampanyasına Katıl`, detail: bestB.title, path: bestB.whereToFindInApp, reward: bR, appId: bestB.appId },
            { num: 2, appName: bestW.appName, title: `${bestW.appName} ile Öde`, detail: bestW.title, path: bestW.whereToFindInApp, reward: wR, appId: bestW.appId }
          ]
        });
      }

      // 3. Harcama Bölme
      const eligible = [...rel].filter(c => c.minSpend <= simulatedSpend && remainingQuota(c) > 0)
        .sort((a,b) => (calcReward(b, b.minSpend)/b.minSpend) - (calcReward(a, a.minSpend)/a.minSpend));
      if (eligible.length >= 2) {
        let rem = simulatedSpend;
        let splitSteps = [];
        let involvedIds = [];
        let splitTot = 0;
        for (const c of eligible) {
          if (rem >= c.minSpend && splitSteps.length < 3) {
            const slice = c.rate > 0 ? Math.min(rem, Math.max(c.minSpend, remainingQuota(c) / (c.rate/100))) : c.minSpend;
            if (rem >= slice) {
              const r = calcReward(c, slice);
              if (r > 0) {
                rem -= slice;
                splitTot += r;
                involvedIds.push(c.id);
                splitSteps.push({
                  num: splitSteps.length + 1,
                  appName: c.appName,
                  title: `${Math.round(slice)} ₺'yi ${c.appName} ile Öde`,
                  detail: c.title,
                  path: c.whereToFindInApp,
                  reward: r,
                  appId: c.appId
                });
              }
            }
          }
        }
        const bestSingle = rel.reduce((m, c) => Math.max(m, calcReward(c, simulatedSpend)), 0);
        if (splitSteps.length >= 2 && splitTot > bestSingle) {
          plans.push({
            id: "p_split",
            badge: "✂️ HARCAMA BÖLME STRATEJİSİ",
            title: `Ödemeyi ${splitSteps.length} Parçaya Böl (+${Math.round(splitTot - bestSingle)} ₺ Ekstra)`,
            subtitle: `Tek kartta kalan kota sınırına takılmak yerine ödemeyi bölerek ${Math.round(splitTot)} ₺ iade alın.`,
            totalCashback: splitTot,
            percent: Math.round((splitTot / simulatedSpend) * 100),
            involvedIds,
            steps: splitSteps
          });
        }
      }

      // 4. Tek İşlem
      const singleSorted = [...rel].map(c => ({ c, r: calcReward(c, simulatedSpend) })).filter(x => x.r > 0).sort((a,b) => b.r - a.r);
      if (singleSorted.length > 0) {
        const best = singleSorted[0];
        plans.push({
          id: "p_single",
          badge: "🎯 TEK İŞLEMDE EN İYİ",
          title: `Tek Seferde Öde: ${best.c.appName}`,
          subtitle: `Kalan ${remainingQuota(best.c)} ₺ kotası üzerinden tek seferde en yüksek net iadeyi verir.`,
          totalCashback: best.r,
          percent: Math.round((best.r / simulatedSpend) * 100),
          involvedIds: [best.c.id],
          steps: [
            { num: 1, appName: best.c.appName, title: `${best.c.appName} ile Öde`, detail: best.c.description, path: best.c.whereToFindInApp, reward: best.r, appId: best.c.appId }
          ]
        });
      }

      return plans.sort((a,b) => b.totalCashback - a.totalCashback);
    }

    function showToast(msg) {
      const t = document.getElementById("toastBanner");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 4200);
    }

    function simulateSpendNotification(appId, amount, category, merchant) {
      const matched = campaigns
        .filter(c => c.appId === appId && c.category === category && !isQuotaFull(c) && amount >= c.minSpend)
        .sort((a,b) => calcReward(b, amount) - calcReward(a, amount))[0];

      let earned = 0;
      if (matched) {
        earned = calcReward(matched, amount);
        matched.earned = Math.min(matched.cap, (matched.earned || 0) + earned);
        matched.steps = (matched.steps || 0) + 1;
        matched.joined = true;
      }

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ":" + now.getMinutes().toString().padStart(2, '0');
      spendLogs.unshift({
        id: "log_" + Date.now(),
        appName: matched ? matched.appName : appId.toUpperCase(),
        merchant,
        amount,
        earned,
        time: timeStr
      });

      savePersistedState();

      if (matched && isQuotaFull(matched)) {
        showToast(`🎉 ${merchant} (${amount} ₺) yakalandı: +${earned} ₺ iade! '${matched.appName}' kotası doldu ve strateji motorundan elendi!`);
      } else if (matched) {
        showToast(`✅ ${merchant} (${amount} ₺) yakalandı: +${earned} ₺ iade! (Kalan Kota: ${remainingQuota(matched)} ₺)`);
      } else {
        showToast(`ℹ️ ${merchant} (${amount} ₺) harcaması kaydedildi (Bu uygulamada açık kota kalmadı).`);
      }
      render();
    }

    function recordManualCampaignStep(camId) {
      const c = campaigns.find(x => x.id === camId);
      if (!c || isQuotaFull(c)) return;
      simulateSpendNotification(c.appId, c.minSpend, c.category, `${c.appName} Harcaması`);
      closeSheet();
    }

    function resetSingleQuota(camId) {
      const c = campaigns.find(x => x.id === camId);
      if (!c) return;
      c.earned = 0;
      c.steps = 0;
      savePersistedState();
      showToast(`↺ '${c.appName}' kampanya kotası sıfırlandı ve strateji motoruna geri eklendi.`);
      closeSheet();
      render();
    }

    function resetAllQuotas() {
      campaigns.forEach(c => { c.earned = 0; c.steps = 0; });
      spendLogs = [];
      savePersistedState();
      showToast("↺ Tüm kampanya kotaları ve harcama geçmişi sıfırlandı.");
      render();
    }

    function selectWalletCard(appId) {
      selectedFilterApp = (selectedFilterApp === appId) ? null : appId;
      render();
    }

    function switchTab(idx) {
      currentTab = idx;
      for (let i = 0; i < 4; i++) {
        document.getElementById("nav-" + i).classList.toggle("active", i === idx);
      }
      render();
    }

    function toggleJoin(camId, ev) {
      if (ev) ev.stopPropagation();
      const c = campaigns.find(x => x.id === camId);
      if (c) c.joined = !c.joined;
      savePersistedState();
      render();
    }

    function applyPlanQuotas(planId) {
      const plan = currentPlans.find(p => p.id === planId);
      if (!plan) return;
      (plan.involvedIds || []).forEach(cid => {
        const c = campaigns.find(x => x.id === cid);
        if (c && !isQuotaFull(c)) {
          simulateSpendNotification(c.appId, c.minSpend, c.category, `${plan.title}`);
        }
      });
      closeSheet();
    }

                Paycell 1.050₺ Bildirimi
              </button>
              <button class="btn-full" style="font-size:11.5px; background:var(--secondary);" onclick="simulateSpendNotification('bonusflas', 1000, 'MARKET_GIDA', 'A101 (BonusFlaş Bildirimi)')">
                Bonus 1.000₺ Bildirimi
              </button>
            </div>
            ${spendLogs.length > 0 ? `
              <div style="margin-top:12px; font-size:12px; font-weight:800;">Son Yakalanan Harcama & İade Kayıtları:</div>
              ${spendLogs.slice(0, 5).map(l => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:var(--surface-variant); padding:9px 11px; border-radius:10px; margin-top:6px;">
                  <div>
                    <div style="font-size:12px; font-weight:700;">${l.appName} • ${l.merchant}</div>
                    <div style="font-size:10.5px; color:var(--text-muted);">Harcama: ${l.amount} ₺ • Saat: ${l.time}</div>
                  </div>
                  <span style="font-size:13px; font-weight:800; color:var(--primary);">+${l.earned} ₺</span>
                </div>
              `).join("")}
            ` : ''}
          </div>
          <div class="white-card">
            <div style="font-size:15px; font-weight:800;">📥 Yeni Kampanya Metni / SMS Ekle</div>
            <input id="newCamTxt" type="text" placeholder="Örn: Paycell ile markette 750 TL harcamaya 150 TL iade!"
                   style="width:100%; margin-top:10px; padding:10px; border-radius:12px; border:1px solid var(--border); background:var(--surface-variant); font-size:12px;" />
            <button class="btn-full" style="margin-top:10px;" onclick="addQuickCam()">Kalıcı Hafızaya & Stratejiye Ekle</button>
          </div>
        `;
      }
    }

    function addQuickCam() {
      const el = document.getElementById("newCamTxt");
      if (!el || !el.value.trim()) return;
      campaigns.unshift({
        id: "custom_" + Date.now(),
        appId: "paycell",
        appName: "Paycell",
        title: el.value.trim(),
        description: el.value.trim(),
        whereToFindInApp: "Paycell > Fırsatlar > Bana Özel",
        category: selectedCategory,
        minSpend: 750, rate: 0, flat: 150, cap: 150, requiresJoin: true,
        canStackAsBank: false, joined: true, steps: 0, earned: 0
      });
      savePersistedState();
      showToast("✅ Yeni kampanya kalıcı hafızaya eklendi!");
      render();
    }

    loadPersistedState();
    render();
  </script>
</body>
</html>
