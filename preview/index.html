<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NakitRadar — Modern Fintech Cüzdan & Kombo Asistanı</title>
  <style>
    :root {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-variant: #eef2f6;
      --border: #e2e8f0;
      --primary: #059669;
      --primary-container: #d1fae5;
      --on-primary-container: #065f46;
      --secondary: #2563eb;
      --secondary-container: #dbeafe;
      --on-secondary-container: #1e40af;
      --tertiary-container: #fef3c7;
      --on-tertiary-container: #92400e;
      --text: #0f172a;
      --text-muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body {
      background: #dfe5ef;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .phone-frame {
      width: 100%;
      max-width: 430px;
      height: 92vh;
      background: var(--bg);
      border: 8px solid #0f172a;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 25px 60px rgba(15, 23, 42, 0.22);
    }
    .status-bar {
      background: var(--bg);
      padding: 10px 22px 4px;
      font-size: 11px;
      font-weight: 700;
      color: var(--text);
      display: flex;
      justify-content: space-between;
    }
    .top-header {
      padding: 10px 18px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-logo {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: var(--primary);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 16px;
      box-shadow: 0 4px 10px rgba(5, 150, 105, 0.3);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: var(--text);
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
      margin-top: 2px;
    }
    .icon-btn-group { display: flex; gap: 8px; }
    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      transition: 0.15s;
    }
    .icon-btn:hover { transform: translateY(-1px); border-color: var(--primary); }

    /* Yatay Cüzdan Karuseli (Apple Wallet / Revolut Stili) */
    .wallet-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 6px 18px 12px;
      scrollbar-width: none;
    }
    .wallet-carousel::-webkit-scrollbar { display: none; }
    .wallet-card {
      min-width: 192px;
      height: 112px;
      border-radius: 20px;
      padding: 14px;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      position: relative;
      box-shadow: 0 10px 20px rgba(15, 23, 42, 0.14);
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
    }
    .wallet-card:hover { transform: translateY(-2px); }
    .wallet-card.selected {
      outline: 3px solid var(--text);
      outline-offset: 2px;
    }
    .wallet-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .wallet-badge {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(4px);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }
    .wallet-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .wallet-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-top: 2px;
    }
    .wallet-count { font-size: 11px; opacity: 0.88; font-weight: 500; }
    .wallet-amount { font-size: 17px; font-weight: 800; }

    .toast-banner {
      margin: 0 18px 8px;
      padding: 9px 12px;
      background: var(--primary-container);
      color: var(--on-primary-container);
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      display: none;
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 4px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .white-card {
      background: var(--surface);
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
      border: 1px solid rgba(226, 232, 240, 0.8);
      transition: 0.15s;
    }
    .white-card.clickable { cursor: pointer; }
    .white-card.clickable:hover {
      border-color: var(--primary);
      box-shadow: 0 8px 20px rgba(5, 150, 105, 0.08);
    }

    .chip-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 8px 0 4px;
      scrollbar-width: none;
    }
    .chip-row::-webkit-scrollbar { display: none; }
    .cat-pill {
      white-space: nowrap;
      padding: 7px 13px;
      border-radius: 24px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface-variant);
      color: var(--text);
      cursor: pointer;
      transition: 0.15s;
    }
    .cat-pill.active {
      background: var(--text);
      color: #fff;
      font-weight: 700;
    }

    .preset-row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      margin-top: 8px;
    }
    .preset-btn {
      background: var(--surface-variant);
      border: none;
      border-radius: 10px;
      padding: 7px 2px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }
    .preset-btn.active {
      background: var(--primary);
      color: #fff;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
      margin: 10px 0 4px;
    }

    .pill-badge {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 800;
    }
    .pill-amber { background: var(--tertiary-container); color: var(--on-tertiary-container); }
    .pill-blue { background: var(--secondary-container); color: var(--on-secondary-container); }
    .pill-green {
      background: var(--primary-container);
      color: var(--on-primary-container);
      font-size: 13px;
      padding: 5px 10px;
      border-radius: 10px;
    }

    /* Görsel Akış Şeması (Visual Flow Pipeline) */
    .pipeline-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 10px 0 6px;
    }
    .pipeline-node {
      background: var(--surface-variant);
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 130px;
    }
    .node-num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--text);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .node-title { font-size: 11px; font-weight: 700; color: var(--text); }
    .node-gain { font-size: 11px; font-weight: 700; color: var(--primary); }
    .pipeline-arrow { color: var(--text-muted); font-weight: 800; font-size: 14px; }

    .progress-bar {
      width: 100%;
      height: 6px;
      background: var(--surface-variant);
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.25s;
    }

    .bottom-nav {
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      padding: 8px 6px 12px;
      box-shadow: 0 -4px 16px rgba(15, 23, 42, 0.04);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 2px;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
    }
    .nav-item.active {
      color: var(--primary);
      background: var(--primary-container);
      font-weight: 800;
    }

    /* Tıklayınca Açılan Bottom Sheet (Detay Penceresi) */
    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: flex-end;
      z-index: 50;
    }
    .sheet-backdrop.open { display: flex; }
    .bottom-sheet {
      width: 100%;
      background: var(--surface);
      border-radius: 28px 28px 0 0;
      padding: 16px 20px 26px;
      max-height: 80%;
      overflow-y: auto;
      box-shadow: 0 -10px 30px rgba(15, 23, 42, 0.2);
    }
    .sheet-handle {
      width: 42px;
      height: 5px;
      background: #cbd5e1;
      border-radius: 3px;
      margin: 0 auto 14px;
    }
    .btn-full {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 11px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-outline {
      background: var(--surface-variant);
      color: var(--text);
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 11px;
      cursor: pointer;
    }
    .btn-outline.joined {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }
  </style>
</head>

      {

        title: "Eczane ve Ulaşım Kartlarında Anında %15 Cashback",
        description: "Papara Card ile tüm eczanelerde ve ulaşım kartı yüklemelerinde katılım şartsız anında nakit iade.",
        whereToFindInApp: "Papara > Cashback Sekmesi (Otomatik Aktif)",
        category: "ECZANE_SAGLIK", minSpend: 50, rate: 15, flat: 0, cap: 150, requiresJoin: false,
        canStackAsBank: false, joined: false
      }
    ];

    let currentTab = 0;
    let selectedFilterApp = null;
    let selectedCategory = "MARKET_GIDA";
    let simulatedSpend = 2250;
    let currentPlans = [];

    function calcReward(cam, amount) {
      if (amount < cam.minSpend) return 0;
      let raw = (cam.flat > 0 && cam.rate === 0) ? cam.flat : ((amount * (cam.rate / 100)) + cam.flat);
      return Math.min(raw, cam.cap);
    }

    function buildStrategies() {
      const enabledIds = new Set(apps.filter(a => a.enabled).map(a => a.id));
      const appMap = Object.fromEntries(apps.map(a => [a.id, a]));
      const rel = campaigns.filter(c => enabledIds.has(c.appId) && c.category === selectedCategory);
      const plans = [];

      // 1. Sinerji Zinciri
      const syn = rel.find(c => c.synergyPartner && enabledIds.has(c.synergyPartner) && simulatedSpend >= c.minSpend);
      if (syn) {
        const mainR = calcReward(syn, simulatedSpend);
        const totalR = mainR + (syn.synergyBonus || 0);
        plans.push({
          id: "p_syn",
          badge: "⚡ EKOSİSTEM SİNERJİSİ",
          title: `${syn.appName} + Paycell Çifte İade Zinciri`,
          subtitle: "İki kardeş uygulamanın kampanyasını aynı harcamada tetikleyerek çifte nakit iade alın.",
          totalCashback: totalR,
          percent: Math.round((totalR / simulatedSpend) * 100),
          steps: [
            { num: 1, appName: "Paycell", title: "Paycell Fırsatlar'da Katıl", detail: syn.synergyNote, path: "Paycell > Fırsatlar > Hemen Katıl", reward: syn.synergyBonus, appId: "paycell" },
            { num: 2, appName: syn.appName, title: `${syn.appName} Üzerinden Öde`, detail: syn.description, path: syn.whereToFindInApp, reward: mainR, appId: syn.appId }
          ]
        });
      }

      // 2. Çifte Kazanç Kombosu
      const wallets = rel.filter(c => appMap[c.appId]?.type === "WALLET" && simulatedSpend >= c.minSpend);
      const banks = rel.filter(c => appMap[c.appId]?.type === "BANK" && c.canStackAsBank && simulatedSpend >= c.minSpend);
      if (wallets.length > 0 && banks.length > 0) {
        const bestW = [...wallets].sort((a,b) => calcReward(b, simulatedSpend) - calcReward(a, simulatedSpend))[0];
        const bestB = [...banks].sort((a,b) => calcReward(b, simulatedSpend) - calcReward(a, simulatedSpend))[0];
        const wR = calcReward(bestW, simulatedSpend);
        const bR = calcReward(bestB, simulatedSpend);
        const tot = wR + bR;
        plans.push({
          id: "p_combo",
          badge: "🔥 ÇİFTE KAZANÇ KOMBOSU",
          title: `${bestB.appName} + ${bestW.appName} Kombosu`,
          subtitle: "Banka kartı kampanyası ile ön ödemeli cüzdan iadesini aynı harcamada birleştirin.",
          totalCashback: tot,
          percent: Math.round((tot / simulatedSpend) * 100),
          steps: [
            { num: 1, appName: bestB.appName, title: `${bestB.appName} Kampanyasına Katıl`, detail: bestB.title, path: bestB.whereToFindInApp, reward: bR, appId: bestB.appId },
            { num: 2, appName: bestW.appName, title: `${bestW.appName} ile Öde`, detail: bestW.title, path: bestW.whereToFindInApp, reward: wR, appId: bestW.appId }
          ]
        });
      }

      // 3. Harcama Bölme
      const eligible = [...rel].filter(c => c.minSpend <= simulatedSpend)
        .sort((a,b) => (calcReward(b, b.minSpend)/b.minSpend) - (calcReward(a, a.minSpend)/a.minSpend));
      if (eligible.length >= 2) {
        let rem = simulatedSpend;
        let splitSteps = [];
        let splitTot = 0;
        for (const c of eligible) {
          if (rem >= c.minSpend && splitSteps.length < 3) {
            const slice = c.rate > 0 ? Math.min(rem, Math.max(c.minSpend, c.cap / (c.rate/100))) : c.minSpend;
            if (rem >= slice) {
              const r = calcReward(c, slice);
              if (r > 0) {
                rem -= slice;
                splitTot += r;
                splitSteps.push({
                  num: splitSteps.length + 1,
                  appName: c.appName,
                  title: `${Math.round(slice)} ₺'yi ${c.appName} ile Öde`,
                  detail: c.title,
                  path: c.whereToFindInApp,
                  reward: r,
                  appId: c.appId
                });
              }
            }
          }
        }
        const bestSingle = rel.reduce((m, c) => Math.max(m, calcReward(c, simulatedSpend)), 0);
        if (splitSteps.length >= 2 && splitTot > bestSingle) {
          plans.push({
            id: "p_split",
            badge: "✂️ HARCAMA BÖLME STRATEJİSİ",
            title: `Ödemeyi ${splitSteps.length} Parçaya Böl (+${Math.round(splitTot - bestSingle)} ₺ Ekstra)`,
            subtitle: `Tek kartta üst limite takılmak yerine ödemeyi bölerek ${Math.round(splitTot)} ₺ iade alın.`,
            totalCashback: splitTot,
            percent: Math.round((splitTot / simulatedSpend) * 100),
            steps: splitSteps
          });
        }
      }

      // 4. Tek İşlem
      const singleSorted = [...rel].map(c => ({ c, r: calcReward(c, simulatedSpend) })).filter(x => x.r > 0).sort((a,b) => b.r - a.r);
      if (singleSorted.length > 0) {
        const best = singleSorted[0];
        plans.push({
          id: "p_single",
          badge: "🎯 TEK İŞLEMDE EN İYİ",
          title: `Tek Seferde Öde: ${best.c.appName}`,
          subtitle: "Harcamayı bölmeden tek seferde ödeyecekseniz en yüksek net iadeyi verir.",
          totalCashback: best.r,
          percent: Math.round((best.r / simulatedSpend) * 100),
          steps: [
            { num: 1, appName: best.c.appName, title: `${best.c.appName} ile Öde`, detail: best.c.description, path: best.c.whereToFindInApp, reward: best.r, appId: best.c.appId }
          ]
        });
      }

      return plans.sort((a,b) => b.totalCashback - a.totalCashback);
    }

    function showToast(msg) {
      const t = document.getElementById("toastBanner");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3500);
    }

    function simulateScan() {
      showToast("✅ Cihaz tarandı: 8 Cüzdan & Banka uygulaması senkronize edildi.");
    }

    function simulateNotification() {
      campaigns.unshift({
        id: "notif_" + Date.now(),
        appId: "paycell",
        appName: "Paycell",
        title: "Bildirim Fırsatı: 750 ₺ Harcamaya 125 ₺ Anında Nakit İade!",
        description: "Paycell bildiriminden otomatik yakalandı ve strateji motoruna eklendi.",
        whereToFindInApp: "Paycell > Bildirim Çanı > Bana Özel > Hemen Katıl",
        category: selectedCategory,
        minSpend: 750, rate: 0, flat: 125, cap: 125, requiresJoin: true,
        canStackAsBank: false, joined: false
      });
      showToast("🔔 Paycell'den yeni '+125 ₺ Nakit İade' bildirimi yakalandı!");
      render();
    }

    function selectWalletCard(appId) {
      selectedFilterApp = (selectedFilterApp === appId) ? null : appId;
      render();
    }

    function switchTab(idx) {
      currentTab = idx;
      for (let i = 0; i < 4; i++) {
        document.getElementById("nav-" + i).classList.toggle("active", i === idx);
      }
      render();
    }

    function toggleJoin(camId, ev) {
      if (ev) ev.stopPropagation();
      const c = campaigns.find(x => x.id === camId);
      if (c) c.joined = !c.joined;
      render();
    }

    function openPlanSheet(planId) {
      const plan = currentPlans.find(p => p.id === planId);
      if (!plan) return;
      const sheet = document.getElementById("sheetContent");
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <span class="pill-badge pill-amber">${plan.badge}</span>
        <div style="font-size:18px; font-weight:800; margin-top:6px;">${plan.title}</div>
        <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${plan.subtitle}</div>
        <div style="margin-top:14px; display:flex; flex-direction:column; gap:10px;">
          ${plan.steps.map(s => `
            <div style="background:var(--surface-variant); border-radius:14px; padding:13px;">
              <div style="display:flex; justify-content:space-between; font-weight:800; font-size:13px;">
                <span>${s.num}. ${s.title}</span>
                <span style="color:var(--primary)">+${Math.round(s.reward)} ₺</span>
              </div>
              <div style="font-size:12px; color:var(--text-muted); margin-top:4px;">${s.detail}</div>
              <div style="font-size:11px; color:var(--secondary); font-weight:700; margin-top:6px;">
                🧭 Gizli Menü Yolu: ${s.path}
              </div>
            </div>
          `).join("")}
        </div>
        <button class="btn-full" style="margin-top:16px;" onclick="closeSheet()">Tamam, Anladım</button>
      `;
      document.getElementById("sheetBackdrop").classList.add("open");
    }

    function openCampaignSheet(camId) {
      const c = campaigns.find(x => x.id === camId);
      if (!c) return;
      const sheet = document.getElementById("sheetContent");
      sheet.innerHTML = `
        <div class="sheet-handle"></div>
        <span class="pill-badge pill-green">${c.appName} • +${c.cap} ₺ Nakit İade</span>
        <div style="font-size:18px; font-weight:800; margin-top:8px;">${c.title}</div>
        <div style="font-size:13px; color:var(--text-muted); margin-top:6px; line-height:1.45;">${c.description}</div>
        <div style="background:var(--surface-variant); border-radius:14px; padding:14px; margin-top:12px;">
          <div style="font-size:12px; font-weight:800; color:var(--secondary);">🧭 Uygulamada Hangi Sekmede Bulunur?</div>
          <div style="font-size:13px; font-weight:600; margin-top:4px;">${c.whereToFindInApp}</div>
        </div>
        ${c.synergyNote ? `
          <div style="background:var(--tertiary-container); color:var(--on-tertiary-container); border-radius:14px; padding:12px; margin-top:10px; font-size:12px; font-weight:600;">
            ⚡ Kombo İpucu: ${c.synergyNote}
          </div>
        ` : ''}
        <div style="display:flex; gap:10px; margin-top:16px;">
          <button class="btn-full" style="background:var(--surface-variant); color:var(--text);" onclick="toggleJoin('${c.id}'); closeSheet();">
            ${c.joined ? '✓ Katıldım İşaretli' : 'Katıldım İşaretle'}
          </button>
          <button class="btn-full" onclick="closeSheet()">Kapat</button>
        </div>
      `;
      document.getElementById("sheetBackdrop").classList.add("open");
    }

    function closeSheet(ev) {
      document.getElementById("sheetBackdrop").classList.remove("open");
    }

    function render() {
      const activeApps = apps.filter(a => a.enabled);
      const enabledIds = new Set(activeApps.map(a => a.id));
      const activeCampaigns = campaigns.filter(c => enabledIds.has(c.appId));
      const totalPot = activeCampaigns.reduce((s, c) => s + c.cap, 0);
      const joinedTot = campaigns.filter(c => c.joined).reduce((s, c) => s + c.cap, 0);

      document.getElementById("headerSub").textContent = `Kazanılabilir Havuz: ${totalPot} ₺ • Katıldığım: ${joinedTot} ₺`;

      // Cüzdan Karuseli Render
      const carousel = document.getElementById("walletCarousel");
      carousel.innerHTML = `
        <div class="wallet-card ${selectedFilterApp === null ? 'selected' : ''}"
             style="background: linear-gradient(135deg, #0f172a, #1e293b); min-width: 168px;"
             onclick="selectWalletCard(null)">
          <div class="wallet-top">
            <span class="wallet-badge">TÜM CÜZDANLAR</span>
            <span>💳</span>
          </div>
          <div>
            <div style="font-size:21px; font-weight:800;">${totalPot} ₺</div>
            <div style="font-size:11px; color:#34d399; font-weight:700;">${activeApps.length} Uygulama • ${activeCampaigns.length} Fırsat</div>
          </div>
        </div>
        ${activeApps.map(app => {
          const appCams = campaigns.filter(c => c.appId === app.id);
          const sum = appCams.reduce((s,c) => s + c.cap, 0);
          return `
            <div class="wallet-card ${selectedFilterApp === app.id ? 'selected' : ''}"
                 style="background: ${app.grad};"
                 onclick="selectWalletCard('${app.id}')">
              <div class="wallet-top">
                <span class="wallet-badge">${app.badge}</span>
                <span>)))</span>
              </div>
              <div>
                <div class="wallet-name">${app.name}</div>
                <div class="wallet-bottom">
                  <span class="wallet-count">${appCams.length} Kampanya</span>
                  <span class="wallet-amount">+${sum} ₺</span>
                </div>
              </div>
            </div>
          `;
        }).join("")}
      `;

      const main = document.getElementById("mainScroll");

      if (currentTab === 0) {
        currentPlans = buildStrategies();
        main.innerHTML = `
          <div class="white-card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div style="font-size:15px; font-weight:800;">Ne Kadar Harcayacaksın?</div>
                <div style="font-size:11px; color:var(--text-muted);">En yüksek nakit iade kombosunu bul</div>
              </div>
              <span class="pill-badge pill-green" style="font-size:16px;">${simulatedSpend} ₺</span>
            </div>

            <div class="chip-row">
              ${categories.map(cat => `
                <div class="cat-pill ${selectedCategory === cat.id ? 'active' : ''}"
                     onclick="selectedCategory='${cat.id}'; render();">
                  ${cat.emoji} ${cat.name}
                </div>
              `).join("")}
            </div>

            <input type="range" min="200" max="5000" step="50" value="${simulatedSpend}"
                   oninput="simulatedSpend=parseInt(this.value); render();" />

            <div class="preset-row">
              ${[500, 1000, 1500, 2250, 3500].map(p => `
                <button class="preset-btn ${simulatedSpend === p ? 'active' : ''}"
                        onclick="simulatedSpend=${p}; render();">${p}₺</button>
              `).join("")}
            </div>
          </div>

          <div style="font-size:14px; font-weight:800; padding: 2px 4px;">
            Önerilen Kombo & İade Stratejileri (${currentPlans.length})
          </div>

          ${currentPlans.map(p => `
            <div class="white-card clickable" onclick="openPlanSheet('${p.id}')">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="pill-badge pill-amber">${p.badge}</span>
                <span class="pill-badge pill-green">+${Math.round(p.totalCashback)} ₺ İADE</span>
              </div>
              <div style="font-size:15px; font-weight:800; margin-top:8px;">${p.title}</div>

              <div class="pipeline-row">
                ${p.steps.map((s, idx) => `
                  <div class="pipeline-node">
                    <div class="node-num">${s.num}</div>
                    <div>
                      <div class="node-title">${s.appName}</div>
                      <div class="node-gain">+${Math.round(s.reward)} ₺ kazan</div>
                    </div>
                  </div>
                  ${idx < p.steps.length - 1 ? `<span class="pipeline-arrow">➔</span>` : ''}
                `).join("")}
              </div>

              <div style="display:flex; justify-content:space-between; align-items:center; margin-top:4px; font-size:11px; color:var(--text-muted); font-weight:600;">
                <span>Net İade Oranı: %${p.percent}</span>
                <span style="color:var(--secondary); font-weight:800;">Adımları Gör ›</span>
              </div>
            </div>
          `).join("")}
        `;
      } else if (currentTab === 1) {
        const list = activeCampaigns.filter(c => !selectedFilterApp || c.appId === selectedFilterApp);
        main.innerHTML = `
          <div style="font-size:14px; font-weight:800; padding: 2px 4px;">
            ${selectedFilterApp ? 'Seçili Cüzdan Kampanyaları' : 'Tüm Aktif Kampanyalar'} (${list.length})
          </div>
          ${list.map(c => `
            <div class="white-card clickable" onclick="openCampaignSheet('${c.id}')">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <div style="display:flex; gap:6px; align-items:center;">
                  <span class="pill-badge pill-blue">${c.appName}</span>
                  ${c.synergyPartner ? `<span class="pill-badge pill-amber">⚡ Kombo</span>` : ''}
                </div>
                <span class="pill-badge pill-green">+${c.cap} ₺</span>
              </div>
              <div style="font-size:14px; font-weight:700; margin-top:8px;">${c.title}</div>
              <div class="progress-bar">
                <div class="progress-fill" style="width:${c.joined ? '100%' : '28%'}; background:${c.joined ? 'var(--primary)' : 'var(--secondary)'};"></div>
              </div>
              <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-muted); font-weight:600;">
                <span>Alt Limit: ${c.minSpend} ₺ • Gizli Sekmeyi Gör ›</span>
                <button class="btn-outline ${c.joined ? 'joined' : ''}" onclick="toggleJoin('${c.id}', event)">
                  ${c.joined ? '✓ Katıldım' : 'Katıl İşaretle'}
                </button>
              </div>
            </div>
          `).join("")}
        `;
      } else if (currentTab === 2) {
        const tp = campaigns.filter(c => c.appId === "turkcell" || c.appId === "paycell");
        main.innerHTML = `
          <div class="white-card">
            <div style="font-size:15px; font-weight:800;">⚡ Turkcell + Paycell Çifte İade Akışı</div>
            <div class="pipeline-row" style="margin-top:6px;">
              <div class="pipeline-node"><div class="node-num">1</div><div><div class="node-title">Banka</div><div class="node-gain">Katıl</div></div></div>
              <span class="pipeline-arrow">➔</span>
              <div class="pipeline-node"><div class="node-num">2</div><div><div class="node-title">Paycell</div><div class="node-gain">+75 ₺</div></div></div>
              <span class="pipeline-arrow">➔</span>
              <div class="pipeline-node"><div class="node-num">3</div><div><div class="node-title">Turkcell</div><div class="node-gain">+150 ₺</div></div></div>
            </div>
          </div>
          ${tp.map(c => `
            <div class="white-card clickable" onclick="openCampaignSheet('${c.id}')">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span class="pill-badge pill-blue">${c.appName}</span>
                <span class="pill-badge pill-green">+${c.cap} ₺</span>
              </div>
              <div style="font-size:14px; font-weight:700; margin-top:8px;">${c.title}</div>
              <div style="font-size:11px; color:var(--secondary); font-weight:700; margin-top:6px;">🧭 ${c.whereToFindInApp}</div>
            </div>
          `).join("")}
        `;
      } else {
        main.innerHTML = `
          <div class="white-card">
            <div style="font-size:15px; font-weight:800;">📥 Yeni Kampanya Metni / SMS Ekle</div>
            <input id="newCamTxt" type="text" placeholder="Örn: Paycell ile markette 750 TL harcamaya 150 TL iade!"
                   style="width:100%; margin-top:10px; padding:10px; border-radius:12px; border:1px solid var(--border); background:var(--surface-variant); font-size:12px;" />
            <button class="btn-full" style="margin-top:10px;" onclick="addQuickCam()">Strateji Motoruna Ekle</button>
          </div>
          <div class="white-card">
            <div style="font-size:15px; font-weight:800; margin-bottom:8px;">📱 Cüzdanımdaki Uygulamalar</div>
            ${apps.map(a => `
              <div style="display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid var(--surface-variant);">
                <span style="font-size:13px; font-weight:700;">${a.name}</span>
                <button class="btn-outline ${a.enabled ? 'joined' : ''}" onclick="a_toggle('${a.id}')">
                  ${a.enabled ? 'Aktif' : 'Pasif'}
                </button>
              </div>
            `).join("")}
          </div>
        `;
      }
    }

    function a_toggle(id) {
      const a = apps.find(x => x.id === id);
      if (a) a.enabled = !a.enabled;
      render();
    }

    function addQuickCam() {
      const el = document.getElementById("newCamTxt");
      if (!el || !el.value.trim()) return;
      campaigns.unshift({
        id: "custom_" + Date.now(),
        appId: "paycell",
        appName: "Paycell",
        title: el.value.trim(),
        description: el.value.trim(),
        whereToFindInApp: "Paycell > Fırsatlar > Bana Özel",
        category: selectedCategory,
        minSpend: 750, rate: 0, flat: 150, cap: 150, requiresJoin: true,
        canStackAsBank: false, joined: true
      });
      showToast("✅ Yeni kampanya çözümlendi ve Cüzdana eklendi!");
      render();
    }

    render();
  </script>
</body>
</html>
